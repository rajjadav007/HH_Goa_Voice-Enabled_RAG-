<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Goa 2026 — Voice-Enabled RAG System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 850px;
            width: 100%;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .mode-toggle {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .tab-btn {
            padding: 0.5rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .record-btn {
            background-color: var(--danger-color);
            color: #fff;
        }
        .record-btn.recording {
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge.grounded { background: #15803d; color: #fff; }
        .badge.ungrounded { background: #b45309; color: #fff; }
        .source-item {
            font-family: monospace;
            font-size: 0.9rem;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
        }
        .timing-bar {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }
        .transcript-box {
            font-style: italic;
            color: var(--accent-color);
            background: #0f172a;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1rem;
            border-left: 3px solid var(--accent-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HH Goa 2026 — Voice & Text RAG Demo</h1>
        <p class="subtitle">Multilingual Speech-to-Text & Grounded Question Answering Engine</p>

        <div class="mode-toggle">
            <button id="textTab" class="tab-btn active" onclick="switchTab('text')">Text Input</button>
            <button id="voiceTab" class="tab-btn" onclick="switchTab('voice')">Voice Input</button>
        </div>

        <!-- Text Section -->
        <div id="textSection" class="search-box">
            <input type="text" id="queryInput" placeholder="Ask a question (e.g. What is a corporation?)" value="What is a corporation?">
            <button id="submitBtn" onclick="submitTextQuery()">Execute RAG</button>
        </div>

        <!-- Voice Section -->
        <div id="voiceSection" class="search-box" style="display:none; flex-direction:column; gap:1rem;">
            <div style="display:flex; gap:1rem; align-items:center;">
                <button id="recordBtn" class="record-btn" onclick="toggleRecord()">Start Recording</button>
                <span id="recordStatus" style="color:var(--text-secondary);">Click button to record microphone audio...</span>
            </div>
            <div style="display:flex; gap:0.5rem; align-items:center;">
                <label style="color:var(--text-secondary); font-size:0.9rem;">Or upload audio file:</label>
                <input type="file" id="audioFileInput" accept="audio/*">
                <button onclick="submitAudioFile()">Submit Audio</button>
            </div>
        </div>

        <!-- Results Section -->
        <div id="results" style="display:none;">
            <div id="transcriptCard" class="card" style="display:none;">
                <h3>Transcribed Question</h3>
                <div class="transcript-box" id="transcriptText"></div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>Generated Answer</h3>
                    <span id="groundedBadge" class="badge"></span>
                </div>
                <p id="answerText" style="line-height:1.6;"></p>
                <div class="timing-bar" id="timingText"></div>
            </div>

            <div class="card">
                <h3>Validated Sources</h3>
                <div id="sourcesList"></div>
            </div>
        </div>
    </div>

    <script>
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        function switchTab(mode) {
            if (mode === 'text') {
                document.getElementById('textTab').className = 'tab-btn active';
                document.getElementById('voiceTab').className = 'tab-btn';
                document.getElementById('textSection').style.display = 'flex';
                document.getElementById('voiceSection').style.display = 'none';
            } else {
                document.getElementById('textTab').className = 'tab-btn';
                document.getElementById('voiceTab').className = 'tab-btn active';
                document.getElementById('textSection').style.display = 'none';
                document.getElementById('voiceSection').style.display = 'flex';
            }
        }

        async function submitTextQuery() {
            const query = document.getElementById('queryInput').value;
            const btn = document.getElementById('submitBtn');
            if (!query.trim()) return;

            btn.disabled = true;
            btn.innerText = "Running RAG...";
            document.getElementById('transcriptCard').style.display = 'none';

            try {
                const res = await fetch('/api/v1/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();
                renderResults(data, false);
            } catch (err) {
                alert("Error calling text RAG API: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Execute RAG";
            }
        }

        async function toggleRecord() {
            const recordBtn = document.getElementById('recordBtn');
            const statusLabel = document.getElementById('recordStatus');

            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream);
                    audioChunks = [];

                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) audioChunks.push(event.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                        await uploadAudioBlob(audioBlob, "recorded_query.wav");
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    recordBtn.innerText = "Stop & Submit";
                    recordBtn.classList.add("recording");
                    statusLabel.innerText = "Recording audio... Speak now.";
                } catch (err) {
                    alert("Microphone permission denied or audio device missing: " + err.message);
                }
            } else {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerText = "Start Recording";
                recordBtn.classList.remove("recording");
                statusLabel.innerText = "Processing audio...";
            }
        }

        async function submitAudioFile() {
            const fileInput = document.getElementById('audioFileInput');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert("Please select an audio file first.");
                return;
            }
            const file = fileInput.files[0];
            await uploadAudioBlob(file, file.name);
        }

        async function uploadAudioBlob(blobOrFile, filename) {
            const formData = new FormData();
            formData.append("file", blobOrFile, filename);

            const statusLabel = document.getElementById('recordStatus');
            statusLabel.innerText = "Transcribing with Sarvam & executing RAG...";

            try {
                const res = await fetch('/api/v1/voice-query', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                renderResults(data, true);
            } catch (err) {
                alert("Error processing voice query: " + err.message);
            } finally {
                statusLabel.innerText = "Click button to record microphone audio...";
            }
        }

        function renderResults(data, isVoice) {
            document.getElementById('results').style.display = 'block';
            document.getElementById('answerText').innerText = data.answer;

            if (isVoice && data.transcript) {
                document.getElementById('transcriptCard').style.display = 'block';
                document.getElementById('transcriptText').innerText = `"${data.transcript}"`;
            } else {
                document.getElementById('transcriptCard').style.display = 'none';
            }

            const badge = document.getElementById('groundedBadge');
            if (data.grounded) {
                badge.className = "badge grounded";
                badge.innerText = "Grounded";
            } else {
                badge.className = "badge ungrounded";
                badge.innerText = data.has_context ? "Ungrounded" : "No Context";
            }

            let timingMsg = `Total Latency: ${data.latency_ms}ms | Request ID: ${data.request_id}`;
            if (data.timing_breakdown && data.timing_breakdown.stt_ms) {
                timingMsg = `Voice-to-Answer Total: ${data.latency_ms}ms (STT: ${data.timing_breakdown.stt_ms}ms, RAG: ${data.timing_breakdown.rag_ms}ms) | Request ID: ${data.request_id}`;
            }
            document.getElementById('timingText').innerText = timingMsg;

            const sourcesDiv = document.getElementById('sourcesList');
            sourcesDiv.innerHTML = "";
            if (data.sources && data.sources.length > 0) {
                data.sources.forEach(s => {
                    const item = document.createElement('div');
                    item.className = 'source-item';
                    item.innerText = `Rank ${s.rank}: Chunk ID '${s.chunk_id}' | Doc ID '${s.document_id}'`;
                    sourcesDiv.appendChild(item);
                });
            } else {
                sourcesDiv.innerText = "No sources cited.";
            }
        }
    </script>
</body>
</html>
