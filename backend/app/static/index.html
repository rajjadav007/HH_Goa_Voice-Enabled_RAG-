<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HH Goa 2026 — Voice-Enabled RAG Text Demo</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        h1 {
            color: var(--accent-color);
            margin-bottom: 0.5rem;
        }
        p.subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
        }
        input[type="text"] {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            color: var(--text-primary);
            font-size: 1rem;
        }
        button {
            padding: 0.75rem 1.5rem;
            background-color: var(--accent-color);
            color: #000;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .card {
            background: var(--card-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .badge.grounded { background: #15803d; color: #fff; }
        .badge.ungrounded { background: #b45309; color: #fff; }
        .source-item {
            font-family: monospace;
            font-size: 0.9rem;
            background: #0f172a;
            padding: 0.5rem;
            border-radius: 4px;
            margin-top: 0.5rem;
        }
        .timing-bar {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HH Goa 2026 — Text RAG Demo</h1>
        <p class="subtitle">Milestone 5 End-to-End Text Retrieval-Augmented Generation Pipeline</p>

        <div class="search-box">
            <input type="text" id="queryInput" placeholder="Ask a question (e.g. What is a corporation?)" value="What is a corporation?">
            <button id="submitBtn" onclick="submitQuery()">Execute RAG</button>
        </div>

        <div id="results" style="display:none;">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <h3>Generated Answer</h3>
                    <span id="groundedBadge" class="badge"></span>
                </div>
                <p id="answerText" style="line-height:1.6;"></p>
                <div class="timing-bar" id="timingText"></div>
            </div>

            <div class="card">
                <h3>Validated Sources</h3>
                <div id="sourcesList"></div>
            </div>
        </div>
    </div>

    <script>
        async function submitQuery() {
            const query = document.getElementById('queryInput').value;
            const btn = document.getElementById('submitBtn');
            if (!query.trim()) return;

            btn.disabled = true;
            btn.innerText = "Running RAG...";

            try {
                const res = await fetch('/api/v1/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await res.json();

                document.getElementById('results').style.display = 'block';
                document.getElementById('answerText').innerText = data.answer;

                const badge = document.getElementById('groundedBadge');
                if (data.grounded) {
                    badge.className = "badge grounded";
                    badge.innerText = "Grounded";
                } else {
                    badge.className = "badge ungrounded";
                    badge.innerText = data.has_context ? "Ungrounded" : "No Context";
                }

                document.getElementById('timingText').innerText = `Total Latency: ${data.latency_ms}ms | Request ID: ${data.request_id}`;

                const sourcesDiv = document.getElementById('sourcesList');
                sourcesDiv.innerHTML = "";
                if (data.sources && data.sources.length > 0) {
                    data.sources.forEach(s => {
                        const item = document.createElement('div');
                        item.className = 'source-item';
                        item.innerText = `Rank ${s.rank}: Chunk ID '${s.chunk_id}' | Doc ID '${s.document_id}'`;
                        sourcesDiv.appendChild(item);
                    });
                } else {
                    sourcesDiv.innerText = "No sources cited.";
                }
            } catch (err) {
                alert("Error calling RAG API: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Execute RAG";
            }
        }
    </script>
</body>
</html>
